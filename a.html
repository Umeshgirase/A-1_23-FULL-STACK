<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Rows & Columns</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">Bootstrap Grid System</h2>

    <!-- Row 1 -->
    <div class="row">
        <div class="col bg-primary text-white p-3 border">
            Column 1
        </div>
        <div class="col bg-success text-white p-3 border">
            Column 2
        </div>
        <div class="col bg-warning text-dark p-3 border">
            Column 3
        </div>
    </div>

    <br>

    <!-- Row 2 -->
    <div class="row">
        <div class="col-4 bg-danger text-white p-3 border">
            col-4
        </div>
        <div class="col-8 bg-info text-white p-3 border">
            col-8
        </div>
    </div>

    <br>

    <!-- Row 3 -->
    <div class="row">
        <div class="col-md-3 bg-secondary text-white p-3 border">
            col-md-3
        </div>
        <div class="col-md-6 bg-dark text-white p-3 border">
            col-md-6
        </div>
        <div class="col-md-3 bg-primary text-white p-3 border">
            col-md-3
        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
